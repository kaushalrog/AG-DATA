[project]
name = "agri"
version = "2.0.0"
description = "AG-DATA 2.0: ingestion adapters, API and analysis for mandi price forecasting"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1", "pyarrow>=17", "pandas>=2.2", "numpy>=1.26", "scipy>=1.13",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "requests>=2.32",
  "confluent-kafka>=2.5", "matplotlib>=3.9",
  "lightgbm>=4.5",  # served model fc_lgbm_2025 (agri.forecast.lgbm)
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["py"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["py"]
