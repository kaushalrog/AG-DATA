# Publishes the PWA (app/) to GitHub Pages as a static demo.
# There is no API on Pages: the app detects that and serves its bundled, labelled demo snapshot (app/demo/).
name: pages

on:
  push:
    branches: [agdata-2.0]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node --test app/tests/
      - name: Site contents (app only, without its tests and tools)
        run: |
          mkdir -p _site
          rsync -a --exclude tests --exclude tools app/ _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: deployment
        uses: actions/deploy-pages@v4
