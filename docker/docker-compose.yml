# ================================================================
# HDFS cluster for the Agricultural Big Data project.
#
# One NameNode + three DataNodes, so that replication and DataNode
# failure are genuinely demonstrable rather than asserted: with a
# single DataNode, dfs.replication is capped at 1 and killing it just
# breaks the cluster. With three, `hdfs fsck` shows real replica
# placement and a node can be stopped while reads keep working.
#
# Kafka is deliberately NOT here — it runs natively via Homebrew, to
# keep container memory available for HDFS and Spark on a 16 GB machine.
#
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml down     # keeps volumes
#   docker compose -f docker/docker-compose.yml down -v  # wipes HDFS
# ================================================================

services:

  namenode:
    image: apache/hadoop:3.4.1
    container_name: agri-namenode
    hostname: namenode
    platform: linux/amd64          # Apple Silicon
    user: root
    command: ["/bin/bash", "-c", "/opt/entrypoint/namenode-entrypoint.sh"]
    ports:
      - "127.0.0.1:9870:9870"   # NameNode web UI, localhost only (no auth: never expose)
      - "127.0.0.1:${HDFS_RPC_HOST_PORT:-19000}:9000"   # HDFS RPC, localhost only (host port 19000: 9000 is often taken, e.g. by php-fpm)
    environment:
      HADOOP_HOME: /opt/hadoop
    env_file:
      - ./hadoop.env
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./entrypoint:/opt/entrypoint:ro
      # Staging mount: lets `hdfs dfs -put` read the local datasets
      # directly instead of copying ~11 GB into the container first.
      - ../data:/staging:ro
    healthcheck:
      # The NameNode is only useful once it has left safe mode.
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get | grep -q OFF"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  datanode1: &datanode
    image: apache/hadoop:3.4.1
    container_name: agri-datanode1
    hostname: datanode1
    platform: linux/amd64
    user: root
    command: ["/bin/bash", "-c", "/opt/entrypoint/datanode-entrypoint.sh"]
    environment:
      HADOOP_HOME: /opt/hadoop
    env_file:
      - ./hadoop.env
    volumes:
      - datanode1_data:/hadoop/dfs/data
      - ./entrypoint:/opt/entrypoint:ro
    depends_on:
      namenode:
        condition: service_started

  datanode2:
    <<: *datanode
    container_name: agri-datanode2
    hostname: datanode2
    volumes:
      - datanode2_data:/hadoop/dfs/data
      - ./entrypoint:/opt/entrypoint:ro

  datanode3:
    <<: *datanode
    container_name: agri-datanode3
    hostname: datanode3
    volumes:
      - datanode3_data:/hadoop/dfs/data
      - ./entrypoint:/opt/entrypoint:ro

  # ---------------------------------------------------------------
  # Spark standalone cluster (profile "spark"): 1 master + 2 workers on
  # the same Docker network as HDFS, so executors read blocks directly
  # from the DataNodes. This is a multi-process cluster on ONE host:
  # it exercises the distributed code paths (driver/executor split,
  # network shuffle, HDFS block locality) but is not a multi-machine
  # benchmark.
  #   docker compose -f docker/docker-compose.yml --profile spark up -d
  # ---------------------------------------------------------------
  spark-master:
    image: apache/spark:4.2.0
    container_name: agri-spark-master
    hostname: spark-master
    profiles: ["spark"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "127.0.0.1:8080:8080"   # master UI, localhost only
    volumes:
      - ..:/opt/agri

  spark-worker-1: &sparkworker
    image: apache/spark:4.2.0
    container_name: agri-spark-worker-1
    hostname: spark-worker-1
    profiles: ["spark"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077",
              "--cores", "3", "--memory", "3g"]
    depends_on: [spark-master]
    volumes:
      - ..:/opt/agri

  spark-worker-2:
    <<: *sparkworker
    container_name: agri-spark-worker-2
    hostname: spark-worker-2

volumes:
  namenode_data:
  datanode1_data:
  datanode2_data:
  datanode3_data:
